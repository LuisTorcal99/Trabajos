<section *ngIf="product" class="listing">
  <img class="listing-photo" [src]="product.photo" alt="Photo of {{ product.name }}" />
  <h2 class="listing-heading">{{ product.name }}</h2>
  <p class="listing-price">Precio: {{ product.price }}</p>

  <h2>Ingrese un valor</h2>
  <input type="number" [(ngModel)]="valorIngresado">
  <button (click)="pujar()" class="pujar-btn"> Pujar </button>

  <h3>Valor más alto registrado: {{ valorMinimo }}</h3> 
</section>
